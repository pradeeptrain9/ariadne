services:
  falkordb:
    # Pinned by digest for reproducibility — see docs/decisions.md.
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    container_name: ariadne-falkordb
    ports:
      - "6379:6379"   # graph protocol (RESP)
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  falkordb-data:

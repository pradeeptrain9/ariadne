[project]
name = "ariadne"
version = "0.1.0"
description = "On-call agent whose context and memory are a FalkorDB graph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.7.1",
    "anthropic>=1.13",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ariadne-seed = "ariadne.seed:main"
ariadne-verify = "ariadne.verify:main"
ariadne-agent = "ariadne.agent:main"
ariadne-replay = "ariadne.replay:main"
ariadne-serve = "ariadne.server:main"
ariadne-mcp = "ariadne.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout with docs/, tests/, web/ and fixtures/ alongside the package: setuptools'
# auto-discovery refuses to guess here, and a fresh `pip install -e .` fails with
# "Multiple top-level packages discovered". Naming the package explicitly is the fix.
[tool.setuptools]
packages = ["ariadne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
